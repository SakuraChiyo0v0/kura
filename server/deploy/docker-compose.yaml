# kura-server 部署（一个镜像两个入口：serve / shell）。
#
#   docker network create sso-net        # 已有就跳过：其他应用容器都在这上面
#   cp .env.example .env
#   docker compose up -d
#
# kura-server 不做认证：要么只从绿联中继进来，要么局域网直连（由更外层的手段保护）。
# .env 里不再有账号密码。
#
# 镜像来自 ghcr（CI 构建，见 .github/workflows/kura-server-image.yml），不再本机构建。
# 要临时用本机构建的镜像：docker build -f server/Dockerfile -t kura-server:local . 然后改下面的 image。
services:
  kura-server:
    image: ghcr.io/sakurachiyo0v0/kura-server:latest
    container_name: kura-server
    restart: unless-stopped
    ports:
      - "8898:8080"
    env_file: .env
    environment:
      # 终端：把请求转给 kura-shell 容器
      KURA_SHELL: http://kura-shell:8890
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
      # 查容器端口映射用（清单里的 host_port）。**必须指到下面挂进来的 docker.sock**：
      # 不查的话，清单里 host_port 一律为 0，客户端只好拿 container_port 当本机端口——
      # 两个服务 container_port 相同（如 account-panel 与 bili23-web 都是 8787）时就会撞车、少挂一个。
      KURA_DOCKER_SOCKET: /var/run/docker.sock
      # 容器管理：compose 项目目录（宿主原路径）。下面 volumes 里按**原路径**再挂一次。
      KURA_PROJECT_ROOT: /volume1/docker
      # 自更新：kura-server 自己那个 compose 项目的目录。要更新自己时，Kura 用它来
      # 起一个短命兄弟容器跑 compose（见 server/src/docker/selfupdate.ts）——
      # 那个容器不属于 kura-server 这个 compose 项目，所以不会被一起停掉。
      KURA_SELF_DIR: /volume1/docker/kura-server
    volumes:
      - ./state:/state
      # WebDAV 暴露宿主文件：整个宿主根挂进来（读写），rclone 在里面 serve。
      # 「哪些目录可见、能不能写」由 kura-server 的范围层裁剪（state/webdav.json），不靠挂载权限。
      # /proc /sys /dev 必须用 tmpfs 掩掉：rclone 带 -L 会沿 /proc/self/root/... 无限递归。
      - /:/host
      - { type: tmpfs, target: /host/proc }
      - { type: tmpfs, target: /host/sys }
      - { type: tmpfs, target: /host/dev }
      # 内部令牌经这个卷传给 kura-shell；**持久**（不是每次启动换），
      # 所以 watchtower 单独重建 kura-server 时，还在跑的 kura-shell 照样认（见 main.ts readOrCreateToken）
      - shell-token:/run/kura-shell
      # docker.sock：查端口映射 + 容器管理。**`:ro` 挡不住经 socket 发的 API 写请求**，它只是挂载选项；
      # 真正的边界是代码里的白名单（server/src/docker/engine.ts，每个能调的接口一个具名方法）。
      # docker.sock 等于宿主 root：加用途前先看那张表。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # compose 项目目录按**宿主原路径**挂：compose 里的相对路径（./data）是按执行目录解析后交给 dockerd 的，
      # 在 /host/volume1/... 下执行的话 dockerd 拿到宿主上不存在的路径，会挂一个空目录进去（应用看着像数据全丢）。
      - /volume1/docker:/volume1/docker
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - sso-net
      - kura-internal

  # 特权容器：只跑终端 / exec，不发布端口，只在 kura-internal 上，只认内部令牌。
  #
  # 开了 watchtower：重建这个容器会掐断正在开的终端会话（宿主进程本身不动）。
  # 令牌是持久的，所以重建它不会牵连 kura-server；只是新终端要重连一下。
  kura-shell:
    image: ghcr.io/sakurachiyo0v0/kura-server:latest
    container_name: kura-shell
    command: ["shell"]
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      KURA_SHELL_PORT: "8890"
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
      KURA_AUDIT_FILE: /audit/audit.log
    volumes:
      - shell-token:/run/kura-shell:ro
      - ./state/audit:/audit
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - kura-internal

networks:
  sso-net:
    external: true
  kura-internal:
    internal: true

volumes:
  shell-token:
