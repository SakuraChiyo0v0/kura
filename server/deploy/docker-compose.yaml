# kura-server 部署（一个镜像两个入口：serve / shell）。
#
# 迁移期先用 8898 与旧 sso-gateway（8897）并行，验收通过再换端口（设计文档 §十）。
#
#   docker network create sso-net        # 已有就跳过：其他应用容器都在这上面
#   cp .env.example .env && 填好
#   docker build -f server/Dockerfile -t kura-server:local .   # 在仓库根执行
#   docker compose up -d
services:
  kura-server:
    image: kura-server:local
    container_name: kura-server
    restart: unless-stopped
    ports:
      - "8898:8080"
    env_file: .env
    environment:
      # 终端：把请求转给 kura-shell 容器
      KURA_SHELL: http://kura-shell:8890
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
    volumes:
      - ./state:/state
      # WebDAV 暴露宿主文件：整个宿主根挂进来（读写），rclone 在里面 serve。
      # 「哪些目录可见、能不能写」由 kura-server 的范围层裁剪（state/webdav.json），不靠挂载权限。
      # /proc /sys /dev 必须用 tmpfs 掩掉：rclone 带 -L 会沿 /proc/self/root/... 无限递归。
      - /:/host
      - { type: tmpfs, target: /host/proc }
      - { type: tmpfs, target: /host/sys }
      - { type: tmpfs, target: /host/dev }
      # 内部令牌经这个卷传给 kura-shell（每次启动换一个）
      - shell-token:/run/kura-shell
      # 可选：只读，只用来查端口映射（代码里只调 GET /containers/json）
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sso-net
      - kura-internal

  # 特权容器：只跑终端 / exec，不发布端口，只在 kura-internal 上，只认内部令牌。
  kura-shell:
    image: kura-server:local
    container_name: kura-shell
    command: ["shell"]
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      KURA_SHELL_PORT: "8890"
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
      KURA_AUDIT_FILE: /audit/audit.log
    volumes:
      - shell-token:/run/kura-shell:ro
      - ./state/audit:/audit
    networks:
      - kura-internal

networks:
  sso-net:
    external: true
  kura-internal:
    internal: true

volumes:
  shell-token:
