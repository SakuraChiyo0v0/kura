# kura-server 部署（一个镜像两个入口：serve / shell）。
#
# 迁移期先用 8898 与旧 sso-gateway（8897）并行，验收通过再换端口（设计文档 §十）。
#
#   docker network create sso-net        # 已有就跳过：其他应用容器都在这上面
#   cp .env.example .env && 填好
#   docker compose up -d
#
# 镜像来自 ghcr（CI 构建，见 .github/workflows/kura-server-image.yml），不再本机构建。
# 要临时用本机构建的镜像：docker build -f server/Dockerfile -t kura-server:local . 然后改下面的 image。
services:
  kura-server:
    image: ghcr.io/sakurachiyo0v0/kura-server:latest
    container_name: kura-server
    restart: unless-stopped
    ports:
      - "8898:8080"
    env_file: .env
    environment:
      # 终端：把请求转给 kura-shell 容器
      KURA_SHELL: http://kura-shell:8890
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
    volumes:
      - ./state:/state
      # WebDAV 暴露宿主文件：整个宿主根挂进来（读写），rclone 在里面 serve。
      # 「哪些目录可见、能不能写」由 kura-server 的范围层裁剪（state/webdav.json），不靠挂载权限。
      # /proc /sys /dev 必须用 tmpfs 掩掉：rclone 带 -L 会沿 /proc/self/root/... 无限递归。
      - /:/host
      - { type: tmpfs, target: /host/proc }
      - { type: tmpfs, target: /host/sys }
      - { type: tmpfs, target: /host/dev }
      # 内部令牌经这个卷传给 kura-shell；**持久**（不是每次启动换），
      # 所以 watchtower 单独重建 kura-server 时，还在跑的 kura-shell 照样认（见 main.ts readOrCreateToken）
      - shell-token:/run/kura-shell
      # 可选：只读，只用来查端口映射（代码里只调 GET /containers/json）
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - sso-net
      - kura-internal

  # 特权容器：只跑终端 / exec，不发布端口，只在 kura-internal 上，只认内部令牌。
  #
  # 开了 watchtower：重建这个容器会掐断正在开的终端会话（宿主进程本身不动）。
  # 令牌是持久的，所以重建它不会牵连 kura-server；只是新终端要重连一下。
  kura-shell:
    image: ghcr.io/sakurachiyo0v0/kura-server:latest
    container_name: kura-shell
    command: ["shell"]
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      KURA_SHELL_PORT: "8890"
      KURA_SHELL_TOKEN_FILE: /run/kura-shell/token
      KURA_AUDIT_FILE: /audit/audit.log
    volumes:
      - shell-token:/run/kura-shell:ro
      - ./state/audit:/audit
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - kura-internal

networks:
  sso-net:
    external: true
  kura-internal:
    internal: true

volumes:
  shell-token:
